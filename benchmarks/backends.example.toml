# LLM 백엔드 비교 설정 예시 (의정이슈레이더)
# 사용법: 이 파일을 benchmarks/backends.toml 로 복사한 뒤, 그 머신에서 잴 항목만 남긴다. backends.toml 은 git 제외.
#
# - 모든 백엔드는 OpenAI 호환 /v1/chat/completions 스트리밍으로 측정한다.
# - 회의록 근거가 프롬프트에 들어가므로 base_url 은 localhost(127.0.0.1)만 허용한다.
#   각 머신 안에서 측정하고 결과 폴더만 모은다. 외부 API(OpenAI 등)는 비교 대상에 넣지 않는다.
# - 인증이 필요하면 키 값을 쓰지 말고 환경변수 이름(api_key_env)만 적는다.
# - 비용: usd_per_hour(장비 시간당 단가)를 채우면 결과에 1K 요청 비용이 계산된다. 비워 두면 `-`.
# - 모델: 앱 기본(A.X-4.0-Light)이 RNGD에 없으므로 양쪽 모두 Qwen3 8B로 통일한다(Pet Log와 같은 조합).
# - Qwen3는 thinking 모델이다. 켜 두면 출력 토큰을 추론에 다 써서 답이 비므로 반드시 끈다.
#   furiosa-llm: chat_template_kwargs.enable_thinking = false / Ollama: reasoning_effort = "none"
# - Ollama /v1 은 요청마다 num_ctx 를 받지 않는다. 서버를 OLLAMA_CONTEXT_LENGTH=8192 로 띄운다(앱 num_ctx=8192).

# --- RNGD 서버 (furiosa-llm serve furiosa-ai/Qwen3-8B-FP8 --devices npu:7 --host 127.0.0.1 --port 8000)
[[backends]]
name = "rngd-furiosa-qwen3-8b"
kind = "npu"
base_url = "http://127.0.0.1:8000/v1"
# GET http://127.0.0.1:8000/v1/models 응답의 id 를 그대로 넣는다.
model = "furiosa-ai/Qwen3-8B-FP8"
# api_key_env = "RNGD_API_KEY"
# usd_per_hour = 0.0
max_tokens_param = "max_tokens"
temperature = 0.0

[backends.extra_body.chat_template_kwargs]
enable_thinking = false

# --- 집 PC (RTX 3060 12GB, Ollama) 4bit
[[backends]]
name = "home-ollama-qwen3-8b"
kind = "gpu"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"  # Q4_K_M
# usd_per_hour = 0.0
max_tokens_param = "max_tokens"
temperature = 0.0

[backends.extra_body]
reasoning_effort = "none"

# --- 집 PC 8bit: RNGD FP8과 비트 수를 맞춘 비교용 (Ollama/GGUF에는 FP8이 없고 RTX 3060은 FP8 미지원)
[[backends]]
name = "home-ollama-qwen3-8b-q8"
kind = "gpu"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b-q8_0"
# usd_per_hour = 0.0
max_tokens_param = "max_tokens"
temperature = 0.0

[backends.extra_body]
reasoning_effort = "none"
